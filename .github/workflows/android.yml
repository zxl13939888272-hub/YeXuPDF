name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test local and network-capable variants
        run: ./gradlew :app:testOfflineDebugUnitTest :app:testFossDebugUnitTest --stacktrace
      - name: Build release variants for CI
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: ./gradlew :app:assembleOfflineRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx4g

      - name: Prepare the official upload key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.YEXUPDF_UPLOAD_STORE_FILE_BASE64 }}
          YEXUPDF_UPLOAD_STORE_FILE: ${{ runner.temp }}/yexupdf-upload-key.jks
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$YEXUPDF_UPLOAD_STORE_FILE"
          test -s "$YEXUPDF_UPLOAD_STORE_FILE"
          chmod 600 "$YEXUPDF_UPLOAD_STORE_FILE"

      - name: Build signed offline APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          YEXUPDF_UPLOAD_STORE_FILE: ${{ runner.temp }}/yexupdf-upload-key.jks
          YEXUPDF_UPLOAD_STORE_PASSWORD: ${{ secrets.YEXUPDF_UPLOAD_STORE_PASSWORD }}
          YEXUPDF_UPLOAD_KEY_ALIAS: ${{ secrets.YEXUPDF_UPLOAD_KEY_ALIAS }}
          YEXUPDF_UPLOAD_KEY_PASSWORD: ${{ secrets.YEXUPDF_UPLOAD_KEY_PASSWORD }}
        run: |
          test -s "$YEXUPDF_UPLOAD_STORE_FILE"
          test -n "$YEXUPDF_UPLOAD_STORE_PASSWORD"
          test -n "$YEXUPDF_UPLOAD_KEY_ALIAS"
          test -n "$YEXUPDF_UPLOAD_KEY_PASSWORD"
          ./gradlew :app:assembleOfflineRelease --stacktrace -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8" -Pkotlin.daemon.jvmargs=-Xmx4g

      - name: Name offline APK for downloads
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version="$(grep -m1 'versionName = "' app/build.gradle.kts | cut -d '"' -f 2)"
          test -n "$version"
          apk="app/build/outputs/apk/offline/release/app-offline-release.apk"
          test -s "$apk"
          mv "$apk" "app/build/outputs/apk/offline/release/YeXuPDF-v${version}-offline-arm64.apk"

      - name: Upload CI APK artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: yexupdf-release-apk
          path: app/build/outputs/apk/offline/release/*.apk
          if-no-files-found: error

      - name: Upload signed offline APK artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: yexupdf-release-apk
          path: app/build/outputs/apk/offline/release/YeXuPDF-v*.apk
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
      - name: Download signed APKs
        uses: actions/download-artifact@v4
        with:
          name: yexupdf-release-apk
          path: release-apks
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="release-notes/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          title="$(sed -n '1s/^# //p' "$notes")"
          test -n "$title"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$title" \
            --notes-file "$notes" \
            release-apks/*.apk
